<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Entry — SahodPH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <span class="brand">SahodPH</span>
    <span id="user-info">Loading...</span>
</header>
<main class="container">
    <div class="page-header">
        <h1 id="form-title">Attendance Entry</h1>
        <a href="#" id="back-link" class="btn btn-secondary">&larr; Back</a>
    </div>

    <div id="error-box" class="alert alert-error" style="display:none;"></div>
    <div id="success-box" class="alert alert-success" style="display:none;"></div>

    <form id="attendance-form" class="card-form">
        <p class="muted" id="context-line" style="margin-top:0;">Loading...</p>

        <label for="status">Status *</label>
        <select id="status" required>
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
            <option value="Late">Late</option>
            <option value="Undertime">Undertime</option>
            <option value="Half Day">Half Day</option>
            <option value="Leave">Leave</option>
            <option value="Rest Day">Rest Day</option>
            <option value="Holiday">Holiday</option>
            <option value="Work From Home">Work From Home</option>
        </select>

        <div class="form-row">
            <div>
                <label for="time_in">Time In</label>
                <input type="time" id="time_in">
            </div>
            <div>
                <label for="time_out">Time Out</label>
                <input type="time" id="time_out">
            </div>
            <div>
                <label for="break_minutes">Break (minutes)</label>
                <input type="number" id="break_minutes" min="0" value="60">
            </div>
        </div>

        <div class="form-row">
            <div>
                <label for="late_minutes">Late (minutes)</label>
                <input type="number" id="late_minutes" min="0" value="0">
            </div>
            <div>
                <label for="undertime_minutes">Undertime (minutes)</label>
                <input type="number" id="undertime_minutes" min="0" value="0">
            </div>
        </div>

        <div class="form-row">
            <div>
                <label for="regular_hours">Regular Hours (auto)</label>
                <input type="number" id="regular_hours" step="0.01" readonly style="background:#f5f6f8;">
            </div>
            <div>
                <label for="overtime_hours">Overtime Hours</label>
                <input type="number" id="overtime_hours" step="0.01" min="0" value="0">
            </div>
        </div>

        <label for="notes">Notes</label>
        <textarea id="notes" rows="2"></textarea>

        <button type="submit" id="submit-btn">Save Attendance</button>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/attendance.js"></script>
<script>
(async () => {
    const profile = await requireRole(['admin', 'hr']);
    if (!profile) return;

    document.getElementById('user-info').innerHTML =
        'Signed in as <strong>' + escapeHtml(profile.username) + '</strong> (' +
        escapeHtml(profile.role) + ') &middot; <a href="dashboard.html">Dashboard</a> &middot; <a href="#" id="logout-link">Log out</a>';
    document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
    });

    await initAttendanceForm();
})();
</script>
</body>
</html>
