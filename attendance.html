<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance — SahodPH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <span class="brand">SahodPH</span>
    <span id="user-info">Loading...</span>
</header>
<main class="container">
    <div class="page-header">
        <h1>Attendance</h1>
        <a href="dashboard.html" class="btn btn-secondary">&larr; Dashboard</a>
    </div>

    <div class="card-form" style="max-width:100%;">
        <div class="form-row">
            <div>
                <label for="employee-select">Employee</label>
                <select id="employee-select"><option value="">Loading...</option></select>
            </div>
            <div>
                <label for="month-select">Month</label>
                <input type="month" id="month-select">
            </div>
        </div>
    </div>

    <div id="error-box" class="alert alert-error" style="display:none; margin-top:12px;"></div>
    <div id="loading" class="muted" style="display:none;">Loading attendance...</div>

    <div class="table-wrap" style="margin-top:16px;">
        <table id="attendance-table" style="display:none;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Day</th>
                    <th>Schedule</th>
                    <th>Status</th>
                    <th>Time In</th>
                    <th>Time Out</th>
                    <th>Reg. Hrs</th>
                    <th>OT Hrs</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="attendance-tbody"></tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/attendance.js"></script>
<script>
(async () => {
    const profile = await requireRole(['admin', 'hr', 'payroll']);
    if (!profile) return;

    document.getElementById('user-info').innerHTML =
        'Signed in as <strong>' + escapeHtml(profile.username) + '</strong> (' +
        escapeHtml(profile.role) + ') &middot; <a href="dashboard.html">Dashboard</a> &middot; <a href="#" id="logout-link">Log out</a>';
    document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
    });

    window.canEditAttendance = (profile.role === 'admin' || profile.role === 'hr');

    await initAttendancePage();
})();
</script>
</body>
</html>
