<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget — SahodPH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <span class="brand">SahodPH</span>
    <span id="user-info">Loading...</span>
</header>
<main class="container">
    <div class="page-header">
        <h1>Budget</h1>
        <a href="dashboard.html" class="btn btn-secondary">&larr; Dashboard</a>
    </div>

    <div class="summary-grid">
        <div class="summary-card">
            <p class="muted" style="margin:0;">Total Income</p>
            <p class="summary-amount" id="sum-income">₱0.00</p>
        </div>
        <div class="summary-card">
            <p class="muted" style="margin:0;">Total Expenses</p>
            <p class="summary-amount" id="sum-expenses">₱0.00</p>
        </div>
        <div class="summary-card">
            <p class="muted" style="margin:0;">Remaining</p>
            <p class="summary-amount" id="sum-remaining">₱0.00</p>
        </div>
    </div>

    <div id="error-box" class="alert alert-error" style="display:none;"></div>
    <div id="success-box" class="alert alert-success" style="display:none;"></div>

    <h2 style="font-size:1.1rem;">Add Expense</h2>
    <form id="expense-form" class="card-form">
        <div class="form-row">
            <div>
                <label for="exp-amount">Amount (₱) *</label>
                <input type="number" id="exp-amount" step="0.01" min="0" required>
            </div>
            <div>
                <label for="exp-category">Category</label>
                <select id="exp-category"><option>Loading...</option></select>
            </div>
            <div>
                <label for="exp-date">Date *</label>
                <input type="date" id="exp-date" required>
            </div>
        </div>
        <label for="exp-description">Description</label>
        <input type="text" id="exp-description">
        <button type="submit">Add Expense</button>
    </form>

    <h2 style="font-size:1.1rem; margin-top:24px;">Income</h2>
    <div class="table-wrap">
        <table id="income-table">
            <thead><tr><th>Date</th><th>Source</th><th>Amount</th><th>Description</th></tr></thead>
            <tbody id="income-tbody"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody>
        </table>
    </div>

    <h2 style="font-size:1.1rem; margin-top:24px;">Expenses</h2>
    <div class="table-wrap">
        <table id="expenses-table">
            <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th><th></th></tr></thead>
            <tbody id="expenses-tbody"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/budget.js"></script>
<script>
(async () => {
    const profile = await requireAuth();
    if (!profile) return;

    const fullProfile = await getProfile(profile.user.id);
    document.getElementById('user-info').innerHTML =
        'Signed in as <strong>' + escapeHtml(fullProfile.username) + '</strong> &middot; <a href="dashboard.html">Dashboard</a> &middot; <a href="#" id="logout-link">Log out</a>';
    document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
    });

    document.getElementById('exp-date').valueAsDate = new Date();
    await initBudgetPage();
})();
</script>
</body>
</html>
