<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll Detail — SahodPH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <span class="brand">SahodPH</span>
    <span id="user-info">Loading...</span>
</header>
<main class="container">
    <div class="page-header">
        <h1 id="page-title">Payroll Detail</h1>
        <div style="display:flex; gap:8px;">
            <a href="#" id="payslip-link" class="btn btn-secondary">View Payslip</a>
            <a href="#" id="back-link" class="btn btn-secondary">&larr; Back to Run</a>
        </div>

    <div id="error-box" class="alert alert-error" style="display:none;"></div>
    <div id="success-box" class="alert alert-success" style="display:none;"></div>

    <div class="card-form" style="max-width:100%;">
        <p><strong>Status:</strong> <span id="status-badge">—</span></p>
        <p><strong>Gross Pay:</strong> ₱<span id="gross-pay">0.00</span></p>
        <p><strong>Total Deductions:</strong> ₱<span id="total-deductions">0.00</span></p>
        <p><strong>Net Pay:</strong> ₱<span id="net-pay" style="font-size:1.3rem; font-weight:700;">0.00</span></p>
    </div>

    <h2 style="font-size:1.1rem;">Earnings</h2>
    <div class="table-wrap">
        <table id="earnings-table">
            <thead><tr><th>Type</th><th>Amount</th><th>Notes</th><th></th></tr></thead>
            <tbody id="earnings-tbody"></tbody>
        </table>
    </div>
    <div id="add-earning-row" style="margin-top:10px; display:none;">
        <div class="form-row">
            <select id="new-earning-type">
                <option>Holiday Pay</option>
                <option>Rest Day Pay</option>
                <option>Night Differential</option>
                <option>Allowance</option>
                <option>Bonus</option>
                <option>Other</option>
            </select>
            <input type="number" step="0.01" id="new-earning-amount" placeholder="Amount">
            <input type="text" id="new-earning-notes" placeholder="Notes (optional)">
            <button type="button" class="btn btn-primary" style="width:auto;" onclick="addEarning()">Add</button>
        </div>
    </div>

    <h2 style="font-size:1.1rem; margin-top:24px;">Deductions</h2>
    <div class="table-wrap">
        <table id="deductions-table">
            <thead><tr><th>Type</th><th>Amount</th><th>Notes</th><th></th></tr></thead>
            <tbody id="deductions-tbody"></tbody>
        </table>
    </div>
    <div id="not-configured-list" class="muted" style="margin-top:8px;"></div>
    <div id="add-deduction-row" style="margin-top:10px; display:none;">
        <div class="form-row">
            <select id="new-deduction-type">
                <option>SSS</option>
                <option>PhilHealth</option>
                <option>Pag-IBIG</option>
                <option>Withholding Tax</option>
                <option>Other</option>
            </select>
            <input type="number" step="0.01" id="new-deduction-amount" placeholder="Amount">
            <input type="text" id="new-deduction-notes" placeholder="Notes (optional)">
            <button type="button" class="btn btn-primary" style="width:auto;" onclick="addDeduction()">Add</button>
        </div>
    </div>

    <div style="margin-top:24px;">
        <button id="finalize-btn" class="btn btn-primary" style="display:none; width:auto;" onclick="finalizeRecord()">Finalize Payroll</button>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/payroll.js"></script>
<script>
(async () => {
    const profile = await requireRole(['admin', 'hr', 'payroll']);
    if (!profile) return;

    document.getElementById('user-info').innerHTML =
        'Signed in as <strong>' + escapeHtml(profile.username) + '</strong> (' +
        escapeHtml(profile.role) + ') &middot; <a href="dashboard.html">Dashboard</a> &middot; <a href="#" id="logout-link">Log out</a>';
    document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
    });

    window.canEditPayroll = (profile.role === 'admin' || profile.role === 'payroll');
        const params2 = new URLSearchParams(window.location.search);
    document.getElementById('payslip-link').href = 'payslip.html?record_id=' + params2.get('record_id');
    await initPayrollDetail();
})();
</script>
</body>
</html>
