<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payslip — SahodPH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar no-print">
    <span class="brand">SahodPH</span>
    <span id="user-info">Loading...</span>
</header>
<main class="container">
    <div class="page-header no-print">
        <h1>Payslip</h1>
        <div style="display:flex; gap:8px;">
            <button id="print-btn" class="btn btn-secondary" onclick="window.print()">Print</button>
            <a href="#" id="back-link" class="btn btn-secondary">&larr; Back</a>
        </div>
    </div>

    <div id="error-box" class="alert alert-error no-print" style="display:none;"></div>
    <div id="success-box" class="alert alert-success no-print" style="display:none;"></div>

    <div id="payslip-content" class="payslip-sheet" style="display:none;">
        <div class="payslip-header">
            <h2>SahodPH</h2>
            <p class="muted" style="margin:0;">Payslip</p>
        </div>

        <table class="payslip-info">
            <tr><td><strong>Employee</strong></td><td id="ps-employee"></td></tr>
            <tr><td><strong>Employee Code</strong></td><td id="ps-code"></td></tr>
            <tr><td><strong>Position / Department</strong></td><td id="ps-position"></td></tr>
            <tr><td><strong>Payroll Period</strong></td><td id="ps-period"></td></tr>
            <tr><td><strong>Cutoff Date</strong></td><td id="ps-cutoff"></td></tr>
            <tr><td><strong>Release Date</strong></td><td id="ps-release"></td></tr>
            <tr><td><strong>Status</strong></td><td id="ps-status"></td></tr>
        </table>

        <h3>Earnings</h3>
        <table class="payslip-table">
            <thead><tr><th>Type</th><th style="text-align:right;">Amount</th></tr></thead>
            <tbody id="ps-earnings"></tbody>
            <tfoot><tr><td><strong>Gross Pay</strong></td><td style="text-align:right;" id="ps-gross"><strong></strong></td></tr></tfoot>
        </table>

        <h3>Deductions</h3>
        <table class="payslip-table">
            <thead><tr><th>Type</th><th style="text-align:right;">Amount</th></tr></thead>
            <tbody id="ps-deductions"></tbody>
            <tfoot><tr><td><strong>Total Deductions</strong></td><td style="text-align:right;" id="ps-total-deductions"><strong></strong></td></tr></tfoot>
        </table>

        <div class="payslip-net">
            <span>Net Pay</span>
            <span id="ps-net">₱0.00</span>
        </div>

        <div class="no-print" style="margin-top:24px; display:flex; gap:8px;">
            <button id="release-btn" class="btn btn-primary" style="display:none; width:auto;" onclick="releasePayroll()">Mark as Released</button>
            <button id="received-btn" class="btn btn-primary" style="display:none; width:auto;" onclick="markReceived()">Mark as Received</button>
        </div>
        <p class="muted no-print" id="release-info" style="margin-top:10px;"></p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/payslip.js"></script>
<script>
(async () => {
    const profile = await requireRole(['admin', 'hr', 'payroll']);
    if (!profile) return;

    document.getElementById('user-info').innerHTML =
        'Signed in as <strong>' + escapeHtml(profile.username) + '</strong> (' +
        escapeHtml(profile.role) + ') &middot; <a href="dashboard.html">Dashboard</a> &middot; <a href="#" id="logout-link">Log out</a>';
    document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
    });

    window.canReleasePayroll = (profile.role === 'admin' || profile.role === 'payroll');
    await initPayslip();
})();
</script>
</body>
</html>
